project:
  name: cordova-plugin-insider
  version: 4.0.1
  description: Insider Cordova Plugin — bridges the Insider Mobile SDK (iOS & Android) into Cordova/hybrid apps via a JavaScript wrapper over cordova.exec.
  insider_team: mobile.sdk

type: single-service

languages:
  primary: JavaScript
  secondary:
    - Java
    - Objective-C
    - TypeScript
  breakdown:
    JavaScript: 23      # js/ bridge + hooks/ (excludes __tests__)
    TypeScript: 12      # types/*.d.ts
    Java: 3             # src/android
    Objective-C: 6      # src/ios (.m + .h)

frameworks:
  bridge:
    - name: Apache Cordova
      version: ">=7.0.0"   # cordova-android >=6.3.0, cordova-ios >=4.3.0
  native_ios:
    - name: InsiderMobile
      version: 15.0.0
    - name: InsiderGeofence
      version: 1.2.4
    - name: InsiderHybrid
      version: 1.7.6
  native_android:
    - name: com.useinsider:insider
      version: 16.0.1
    - name: com.useinsider:insiderhybrid
      version: 1.3.4
  testing:
    - name: Jest
      version: ^29.7.0
  build:
    - name: "@babel/preset-env"
      version: ^7.27.2

architecture:
  type: single-service
  patterns:
    design:
      - Bridge (JS ↔ native via cordova.exec)
      - Facade (singleton InsiderPlugin over native SDK)
      - Builder / Fluent (User, Product, Event, Identifier)
      - Promise-wrapper (Utils.asyncExec)
      - Type-tagged serialization (parseObjectWithTypes)
    architecture: Layered Cordova plugin (JS bridge → native dispatcher → Insider SDK)

services:
  - name: cordova-plugin-insider
    path: .
    language: JavaScript
    framework: Apache Cordova
    platforms: [android, ios]
    entry_point: js/InsiderPlugin.js  # built to www/, clobbered onto global `Insider`

conventions:
  js_class_naming: PascalCase
  js_method_naming: camelCase
  native_reference_constants: centralized in js/Constants.js
  parameter_validation: Utils.checkParameters before every native call
  error_handling: try/catch → Utils.asyncExec(..., PUT_ERROR_LOG, ...)
  date_serialization: epoch milliseconds (string) to avoid timezone drift
  fluent_setters: return this
  platform_branching: cordova.platformId guards for iOS/Android-only methods

quality:
  test_runner: Jest
  test_dir: __tests__/
  coverage_sources: [js/**/*.js]
  ci:
    - unit-tests
    - ai-code-review
    - ai-security-review
    - ai-test-coverage

dependencies:
  package_manager: npm
  runtime: [babel]
  dev: ["@babel/cli", "@babel/core", "@babel/preset-env", jest]

versioning:
  sdk_version_string: js/Constants.js → SDK_VERSION ("CDV-<version>")
  ios_pins: plugin.xml (<podspec>)
  android_pins: src/android/build-extras.gradle
  note: keep package.json version, Constants.SDK_VERSION, plugin.xml, and gradle/podspec pins in sync on release.

