name: Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: cordova-demo-run-tests-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  npm_config_registry: https://registry.npmjs.org
  NODE_VERSION: '22'
  CORDOVA_CLI: cordova@12

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org

      - name: Unit Tests
        run: npm test

  integration-android:
    name: Integration (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Must match signingConfigs.release in platforms/android/app/build.gradle, which debug builds also use.
      KEYSTORE: platforms/android/app/mykeystore.jks
      KEYSTORE_ALIAS: test
      KEYSTORE_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org

      - name: Write fake Firebase config and throwaway keystore
        run: |
          cp ci/fixtures/google-services.json platforms/android/app/google-services.json
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"

      - name: Integration Tests
        run: npx --registry=https://registry.npmjs.org "$CORDOVA_CLI" build android --debug

  integration-ios:
    name: Integration (ios)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DESTINATION: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org

      - name: Prepare iOS platform
        run: npx --registry=https://registry.npmjs.org "$CORDOVA_CLI" prepare ios

      - name: Install pods
        working-directory: platforms/ios
        run: pod install

      - name: Integration Tests
        run: |
          xcodebuild build \
            -workspace platforms/ios/HelloCordova.xcworkspace \
            -scheme HelloCordova \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO

  integration-tests:
    name: Integration Tests
    needs:
      - integration-android
      - integration-ios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Integration Tests
        env:
          ANDROID_RESULT: ${{ needs.integration-android.result }}
          IOS_RESULT: ${{ needs.integration-ios.result }}
        run: |
          echo "android: $ANDROID_RESULT, ios: $IOS_RESULT"
          test "$ANDROID_RESULT" = success && test "$IOS_RESULT" = success
